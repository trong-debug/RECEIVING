<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Be Cool Couriers — Delivery Drop-off</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="driver-page">

  <header>
    <div class="logo">Be Cool Couriers</div>
    <h1>Delivery Drop-off</h1>
    <p class="subtitle">Fill in your details when you arrive at the site</p>
  </header>

  <main>
    <div id="success-banner" class="success-banner hidden">
      <div class="success-icon">✓</div>
      <div>
        <strong>Delivery recorded!</strong>
        <p id="success-msg"></p>
      </div>
      <button class="btn-link" onclick="resetForm()">Submit another</button>
    </div>

    <form id="delivery-form" novalidate>

      <!-- Driver -->
      <section class="card">
        <h2>Driver Details</h2>

        <div class="field">
          <label for="driver-select">Your Name <span class="req">*</span></label>
          <select id="driver-select">
            <option value="">— Select your name —</option>
          </select>
        </div>

        <div class="field hidden" id="new-driver-field">
          <label for="new-driver">Enter your name <span class="req">*</span></label>
          <input type="text" id="new-driver" placeholder="Full name" autocomplete="name">
        </div>
      </section>

      <!-- Site -->
      <section class="card">
        <h2>Delivery Site</h2>

        <div class="field">
          <label for="site-select">Site Name <span class="req">*</span></label>
          <select id="site-select">
            <option value="">— Select site —</option>
          </select>
        </div>

        <div class="field hidden" id="new-site-field">
          <label for="new-site">Site Name <span class="req">*</span></label>
          <input type="text" id="new-site" placeholder="Business / site name">
        </div>

        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="Street address">
        </div>
      </section>

      <!-- Time -->
      <section class="card">
        <h2>Arrival Time</h2>

        <div class="field">
          <label for="arrived-at">Arrived At <span class="req">*</span></label>
          <input type="datetime-local" id="arrived-at" required>
          <p class="hint">Set to now automatically — adjust if needed</p>
        </div>
      </section>

      <!-- Pallets -->
      <section class="card">
        <h2>Pallets</h2>
        <div class="pallet-type-list">

          <div class="pallet-entry">
            <div class="pallet-top">
              <span class="pallet-badge pallet-chep">CHEP</span>
              <div class="pallet-counter">
                <button type="button" class="pallet-btn" onclick="adjPallet('chep',-1)">−</button>
                <span class="pallet-num" id="chep-count">0</span>
                <button type="button" class="pallet-btn" onclick="adjPallet('chep',1)">+</button>
              </div>
            </div>
            <div class="disp-row inactive" id="chep-disp-row">
              <button type="button" class="disp-btn" id="chep-Exchanged" onclick="setPalletDisp('chep','Exchanged')">Exchanged</button>
              <button type="button" class="disp-btn" id="chep-Transfer"  onclick="setPalletDisp('chep','Transfer')">Transfer</button>
            </div>
            <div class="field hidden" id="chep-docket-field">
              <label for="chep-docket">CHEP Docket Number(s)</label>
              <input type="text" id="chep-docket" placeholder="Enter docket number(s)">
            </div>
          </div>

          <div class="pallet-divider"></div>

          <div class="pallet-entry">
            <div class="pallet-top">
              <span class="pallet-badge pallet-loscam">LOSCAM</span>
              <div class="pallet-counter">
                <button type="button" class="pallet-btn" onclick="adjPallet('loscam',-1)">−</button>
                <span class="pallet-num" id="loscam-count">0</span>
                <button type="button" class="pallet-btn" onclick="adjPallet('loscam',1)">+</button>
              </div>
            </div>
            <div class="disp-row inactive" id="loscam-disp-row">
              <button type="button" class="disp-btn" id="loscam-Exchanged" onclick="setPalletDisp('loscam','Exchanged')">Exchanged</button>
              <button type="button" class="disp-btn" id="loscam-Transfer"  onclick="setPalletDisp('loscam','Transfer')">Transfer</button>
            </div>
          </div>

          <div class="pallet-divider"></div>

          <div class="pallet-entry">
            <div class="pallet-top">
              <span class="pallet-badge pallet-plain">PLAIN</span>
              <div class="pallet-counter">
                <button type="button" class="pallet-btn" onclick="adjPallet('plain',-1)">−</button>
                <span class="pallet-num" id="plain-count">0</span>
                <button type="button" class="pallet-btn" onclick="adjPallet('plain',1)">+</button>
              </div>
            </div>
            <div class="disp-row inactive" id="plain-disp-row">
              <button type="button" class="disp-btn" id="plain-Exchanged" onclick="setPalletDisp('plain','Exchanged')">Exchanged</button>
              <button type="button" class="disp-btn" id="plain-Transfer"  onclick="setPalletDisp('plain','Transfer')">Transfer</button>
            </div>
          </div>

        </div>
      </section>

      <!-- Stock -->
      <section class="card">
        <h2>Other Stock</h2>
        <div class="stock-grid">
          <div class="field">
            <label for="num-cartons">Cartons</label>
            <input type="number" id="num-cartons" min="0" value="0" inputmode="numeric">
          </div>
          <div class="field">
            <label for="num-satchels">Satchels</label>
            <input type="number" id="num-satchels" min="0" value="0" inputmode="numeric">
          </div>
        </div>
        <div class="field">
          <label for="transport-select">Transport Name</label>
          <select id="transport-select">
            <option value="">— Select carrier —</option>
          </select>
        </div>
        <div class="field hidden" id="new-transport-field">
          <label for="new-transport">Enter carrier name</label>
          <input type="text" id="new-transport" placeholder="e.g. StarTrack, Toll, TNT">
        </div>
        <div class="field">
          <label>Temperature</label>
          <div class="disp-row" id="temp-btn-row">
            <button type="button" class="disp-btn" id="temp-Ambient"  onclick="setTemp('Ambient')">Ambient</button>
            <button type="button" class="disp-btn" id="temp-Chilled"  onclick="setTemp('Chilled')">Chilled</button>
            <button type="button" class="disp-btn" id="temp-Frozen"   onclick="setTemp('Frozen')">Frozen</button>
          </div>
        </div>
        <div class="field hidden" id="temp-value-field">
          <label for="temperature-value">Enter Temperature (°C)</label>
          <input type="number" id="temperature-value" placeholder="e.g. -18" inputmode="numeric">
        </div>
      </section>

      <!-- Condition & Recipient -->
      <section class="card">
        <h2>Delivery Condition</h2>

        <div class="field">
          <label>Stock Condition <span class="req">*</span></label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="condition" value="Good" checked>
              <span class="radio-pill good">Good</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="condition" value="Damaged">
              <span class="radio-pill damaged">Damaged</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="condition" value="Partial">
              <span class="radio-pill partial">Partial</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label for="recipient">Received By (name)</label>
          <input type="text" id="recipient" placeholder="Name of person who received the delivery">
        </div>
      </section>

      <!-- Notes -->
      <section class="card">
        <h2>Notes</h2>
        <div class="field">
          <label for="notes">Additional Notes</label>
          <textarea id="notes" rows="3" placeholder="Any issues, access info, or extra details…"></textarea>
        </div>
      </section>

      <div class="submit-row">
        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-text">Submit Drop-off Record</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
      </div>

      <div id="error-msg" class="error-msg hidden"></div>

    </form>
  </main>

  <footer>
    <a href="/admin">Admin View →</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
